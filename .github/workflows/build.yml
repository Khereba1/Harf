name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Gradle is installed here instead of relying on gradle-wrapper.jar (the project has no wrapper)
      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O "$RUNNER_TEMP/gradle.zip"
          sudo unzip -q "$RUNNER_TEMP/gradle.zip" -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Stable signing key from GitHub Secrets (see setup_signing.sh). Without it a temporary key is used
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the stable signing key."
          else
            echo "No signing key secrets found: using a temporary debug signature."
          fi

      # Open-licensed fonts (SIL OFL) are fetched at build time and bundled into the APK; they are never committed.
      # Any file that fails to download is just skipped: the app still works with the built-in system fonts.
      - name: Download open fonts
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          BASE="https://raw.githubusercontent.com/google/fonts/main/ofl"
          get() {
            if curl -fsSL --retry 2 --max-time 60 "$BASE/$1" -o "app/src/main/assets/fonts/$2"; then
              echo "ok: $2"
            else
              rm -f "app/src/main/assets/fonts/$2"
              echo "skipped: $2"
            fi
          }
          get amiri/Amiri-Regular.ttf Amiri-Regular.ttf
          get amiri/Amiri-Bold.ttf Amiri-Bold.ttf
          get tajawal/Tajawal-Regular.ttf Tajawal-Regular.ttf
          get tajawal/Tajawal-Bold.ttf Tajawal-Bold.ttf
          get tajawal/Tajawal-Black.ttf Tajawal-Black.ttf
          get almarai/Almarai-Regular.ttf Almarai-Regular.ttf
          get almarai/Almarai-Bold.ttf Almarai-Bold.ttf
          get almarai/Almarai-ExtraBold.ttf Almarai-ExtraBold.ttf
          get lalezar/Lalezar-Regular.ttf Lalezar-Regular.ttf
          get scheherazadenew/ScheherazadeNew-Regular.ttf ScheherazadeNew-Regular.ttf
          get scheherazadenew/ScheherazadeNew-Bold.ttf ScheherazadeNew-Bold.ttf
          get lobster/Lobster-Regular.ttf Lobster-Regular.ttf
          get pacifico/Pacifico-Regular.ttf Pacifico-Regular.ttf
          get satisfy/Satisfy-Regular.ttf Satisfy-Regular.ttf
          get bebasneue/BebasNeue-Regular.ttf BebasNeue-Regular.ttf
          get anton/Anton-Regular.ttf Anton-Regular.ttf
          get bangers/Bangers-Regular.ttf Bangers-Regular.ttf
          get righteous/Righteous-Regular.ttf Righteous-Regular.ttf
          get abrilfatface/AbrilFatface-Regular.ttf AbrilFatface-Regular.ttf
          get permanentmarker/PermanentMarker-Regular.ttf PermanentMarker-Regular.ttf
          get specialelite/SpecialElite-Regular.ttf SpecialElite-Regular.ttf
          get blackopsone/BlackOpsOne-Regular.ttf BlackOpsOne-Regular.ttf
          get harmattan/Harmattan-Regular.ttf Harmattan-Regular.ttf
          get harmattan/Harmattan-Bold.ttf Harmattan-Bold.ttf
          get lateef/Lateef-Regular.ttf Lateef-Regular.ttf
          get rakkas/Rakkas-Regular.ttf Rakkas-Regular.ttf
          get katibeh/Katibeh-Regular.ttf Katibeh-Regular.ttf
          get mirza/Mirza-Regular.ttf Mirza-Regular.ttf
          get mirza/Mirza-Bold.ttf Mirza-Bold.ttf
          get jomhuria/Jomhuria-Regular.ttf Jomhuria-Regular.ttf
          get arefruqaa/ArefRuqaa-Regular.ttf ArefRuqaa-Regular.ttf
          get arefruqaa/ArefRuqaa-Bold.ttf ArefRuqaa-Bold.ttf
          get blaka/Blaka-Regular.ttf Blaka-Regular.ttf
          get gulzar/Gulzar-Regular.ttf Gulzar-Regular.ttf
          get amiriquran/AmiriQuran-Regular.ttf AmiriQuran-Regular.ttf
          get ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf IBMPlexSansArabic-Regular.ttf
          get ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf IBMPlexSansArabic-Bold.ttf
          get cairo/Cairo%5Bslnt%2Cwght%5D.ttf Cairo-Regular.ttf
          get elmessiri/ElMessiri%5Bwght%5D.ttf ElMessiri-Regular.ttf
          get reemkufi/ReemKufi%5Bwght%5D.ttf ReemKufi-Regular.ttf
          get changa/Changa%5Bwght%5D.ttf Changa-Regular.ttf
          get lemonada/Lemonada%5Bwght%5D.ttf Lemonada-Regular.ttf
          get markazitext/MarkaziText%5Bwght%5D.ttf MarkaziText-Regular.ttf
          get notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf NotoKufiArabic-Regular.ttf
          get greatvibes/GreatVibes-Regular.ttf GreatVibes-Regular.ttf
          get sacramento/Sacramento-Regular.ttf Sacramento-Regular.ttf
          get cookie/Cookie-Regular.ttf Cookie-Regular.ttf
          get yellowtail/Yellowtail-Regular.ttf Yellowtail-Regular.ttf
          get kaushanscript/KaushanScript-Regular.ttf KaushanScript-Regular.ttf
          get shadowsintolight/ShadowsIntoLight.ttf ShadowsIntoLight.ttf
          get indieflower/IndieFlower-Regular.ttf IndieFlower-Regular.ttf
          get gochihand/GochiHand-Regular.ttf GochiHand-Regular.ttf
          get caveatbrush/CaveatBrush-Regular.ttf CaveatBrush-Regular.ttf
          get rocksalt/RockSalt-Regular.ttf RockSalt-Regular.ttf
          get amaticsc/AmaticSC-Regular.ttf AmaticSC-Regular.ttf
          get amaticsc/AmaticSC-Bold.ttf AmaticSC-Bold.ttf
          get chewy/Chewy-Regular.ttf Chewy-Regular.ttf
          get luckiestguy/LuckiestGuy-Regular.ttf LuckiestGuy-Regular.ttf
          get bungee/Bungee-Regular.ttf Bungee-Regular.ttf
          get staatliches/Staatliches-Regular.ttf Staatliches-Regular.ttf
          get archivoblack/ArchivoBlack-Regular.ttf ArchivoBlack-Regular.ttf
          get alfaslabone/AlfaSlabOne-Regular.ttf AlfaSlabOne-Regular.ttf
          get paytoneone/PaytoneOne-Regular.ttf PaytoneOne-Regular.ttf
          get bowlbyone/BowlbyOne-Regular.ttf BowlbyOne-Regular.ttf
          get russoone/RussoOne-Regular.ttf RussoOne-Regular.ttf
          get monoton/Monoton-Regular.ttf Monoton-Regular.ttf
          get limelight/Limelight-Regular.ttf Limelight-Regular.ttf
          get creepster/Creepster-Regular.ttf Creepster-Regular.ttf
          get fascinate/Fascinate-Regular.ttf Fascinate-Regular.ttf
          get unifrakturcook/UnifrakturCook-Bold.ttf UnifrakturCook-Bold.ttf
          get lato/Lato-Regular.ttf Lato-Regular.ttf
          get lato/Lato-Bold.ttf Lato-Bold.ttf
          get courierprime/CourierPrime-Regular.ttf CourierPrime-Regular.ttf
          echo "Fonts bundled: $(ls app/src/main/assets/fonts | wc -l)"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # If the build failed: a short list of the real errors, shown at the top of the run page
      - name: Show build errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "^e: |What went wrong|Execution failed|FAILED|error:|Caused by|OutOfMemory" -A4 build.log | head -120 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Stable download link for the phone: the Releases page (tag "latest")
      - name: Publish to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NAME="${GH_REPO##*/}"
          cp app/build/outputs/apk/release/*.apk "$NAME.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$NAME.apk" --title "$NAME - latest build" --notes "Automatic build of commit ${{ github.sha }}" --target "${{ github.sha }}"
